<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680">
  <defs>
    <!-- Gradients for depth bars -->
    <linearGradient id="bidGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ECB81;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0ECB81;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="askGradient" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F6465D;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#F6465D;stop-opacity:0.5"/>
    </linearGradient>
    <!-- Pattern for noise area -->
    <pattern id="noisePattern" patternUnits="userSpaceOnUse" width="6" height="6">
      <path d="M0 6L6 0M-1.5 1.5L1.5 -1.5M4.5 7.5L7.5 4.5" stroke="#666" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#12131A"/>

  <!-- Main Title -->
  <text x="450" y="35" text-anchor="middle" fill="#EAECEF" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">归一化的真相：当买卖失衡时，Sum 隐藏了"墙"</text>
  <text x="450" y="58" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="13">场景：买盘挂 800 BTC（主力护盘），卖盘仅 200 BTC（抛压微弱）</text>

  <!-- ==================== SUM SECTION (Left) ==================== -->
  <g transform="translate(30, 90)">
    <!-- Section Title -->
    <text x="200" y="0" text-anchor="middle" fill="#F6465D" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">❌ Sum 逻辑</text>
    <text x="200" y="24" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="12">分母 = 800 + 200 = 1000</text>

    <!-- Order Book Container -->
    <rect x="0" y="40" width="400" height="260" fill="#1E1F26" rx="10" stroke="#2B2F36" stroke-width="1"/>

    <!-- Headers -->
    <text x="100" y="65" text-anchor="middle" fill="#0ECB81" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">买盘 (800 BTC)</text>
    <text x="300" y="65" text-anchor="middle" fill="#F6465D" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">卖盘 (200 BTC)</text>

    <!-- Divider -->
    <line x1="200" y1="75" x2="200" y2="290" stroke="#2B2F36" stroke-width="1"/>

    <!-- Bid Side (Left) - Max 80% width (800/1000) -->
    <g transform="translate(10, 85)">
      <!-- Noise area (the 20% that is "wasted") -->
      <rect x="0" y="0" width="32" height="38" fill="url(#noisePattern)"/>
      <rect x="0" y="44" width="24" height="38" fill="url(#noisePattern)"/>
      <rect x="0" y="88" width="16" height="38" fill="url(#noisePattern)"/>
      <rect x="0" y="132" width="8" height="38" fill="url(#noisePattern)"/>
      
      <!-- Signal bars: 200/1000=20%, 400/1000=40%, 600/1000=60%, 800/1000=80% -->
      <rect x="32" y="0" width="108" height="38" fill="url(#bidGradient)" rx="3"/>
      <rect x="24" y="44" width="116" height="38" fill="url(#bidGradient)" rx="3"/>
      <rect x="16" y="88" width="124" height="38" fill="url(#bidGradient)" rx="3"/>
      <rect x="8" y="132" width="132" height="38" fill="url(#bidGradient)" rx="3"/>
      
      <!-- Progress Percentage Labels -->
      <text x="175" y="24" text-anchor="end" fill="#0ECB81" font-family="monospace" font-size="11">20%</text>
      <text x="175" y="68" text-anchor="end" fill="#0ECB81" font-family="monospace" font-size="11">40%</text>
      <text x="175" y="112" text-anchor="end" fill="#0ECB81" font-family="monospace" font-size="11">60%</text>
      <text x="175" y="156" text-anchor="end" fill="#0ECB81" font-family="monospace" font-size="11">80%</text>
      
      <!-- "Never full" indicator -->
      <text x="70" y="195" text-anchor="middle" fill="#F6465D" font-family="system-ui, sans-serif" font-size="10">⬆️ 永远不满格！</text>
    </g>

    <!-- Ask Side (Right) - Max 20% width (200/1000) -->
    <g transform="translate(210, 85)">
      <!-- Signal bars: 50/1000=5%, 100/1000=10%, 150/1000=15%, 200/1000=20% -->
      <rect x="0" y="0" width="18" height="38" fill="url(#askGradient)" rx="3"/>
      <rect x="0" y="44" width="27" height="38" fill="url(#askGradient)" rx="3"/>
      <rect x="0" y="88" width="34" height="38" fill="url(#askGradient)" rx="3"/>
      <rect x="0" y="132" width="36" height="38" fill="url(#askGradient)" rx="3"/>
      
      <!-- Noise area -->
      <rect x="18" y="0" width="152" height="38" fill="url(#noisePattern)"/>
      <rect x="27" y="44" width="143" height="38" fill="url(#noisePattern)"/>
      <rect x="34" y="88" width="136" height="38" fill="url(#noisePattern)"/>
      <rect x="36" y="132" width="134" height="38" fill="url(#noisePattern)"/>
      
      <!-- Progress Percentage Labels -->
      <text x="5" y="24" text-anchor="start" fill="#F6465D" font-family="monospace" font-size="11">5%</text>
      <text x="5" y="68" text-anchor="start" fill="#F6465D" font-family="monospace" font-size="11">10%</text>
      <text x="5" y="112" text-anchor="start" fill="#F6465D" font-family="monospace" font-size="11">15%</text>
      <text x="5" y="156" text-anchor="start" fill="#F6465D" font-family="monospace" font-size="11">20%</text>
    </g>

    <!-- Problem Callout -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="400" height="65" fill="#3D1F1F" rx="8" stroke="#F6465D" stroke-width="1" stroke-opacity="0.5"/>
      <text x="200" y="22" text-anchor="middle" fill="#F6465D" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">⚠️ 致命问题</text>
      <text x="200" y="42" text-anchor="middle" fill="#EAECEF" font-family="system-ui, sans-serif" font-size="11">买盘是卖盘的 4 倍，但看起来只强了一点点。</text>
      <text x="200" y="57" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="10">"墙"被矮化了，交易员无法感知真正的买方压力。</text>
    </g>
  </g>

  <!-- ==================== MAX SECTION (Right) ==================== -->
  <g transform="translate(470, 90)">
    <!-- Section Title -->
    <text x="200" y="0" text-anchor="middle" fill="#0ECB81" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">✅ Max 逻辑</text>
    <text x="200" y="24" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="12">分母 = max(800, 200) = 800</text>

    <!-- Order Book Container -->
    <rect x="0" y="40" width="400" height="260" fill="#1E1F26" rx="10" stroke="#2B2F36" stroke-width="1"/>

    <!-- Headers -->
    <text x="100" y="65" text-anchor="middle" fill="#0ECB81" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">买盘 (800 BTC) 🐋</text>
    <text x="300" y="65" text-anchor="middle" fill="#F6465D" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">卖盘 (200 BTC)</text>

    <!-- Divider -->
    <line x1="200" y1="75" x2="200" y2="290" stroke="#2B2F36" stroke-width="1"/>

    <!-- Bid Side (Left) - 100% width (strong side fills screen) -->
    <g transform="translate(10, 85)">
      <!-- Signal bars: 200/800=25%, 400/800=50%, 600/800=75%, 800/800=100% -->
      <rect x="0" y="0" width="42" height="38" fill="url(#bidGradient)" rx="3"/>
      <rect x="0" y="44" width="85" height="38" fill="url(#bidGradient)" rx="3"/>
      <rect x="0" y="88" width="127" height="38" fill="url(#bidGradient)" rx="3"/>
      <rect x="0" y="132" width="170" height="38" fill="url(#bidGradient)" rx="3"/>
      
      <!-- THE WALL highlight -->
      <rect x="0" y="132" width="170" height="38" fill="none" stroke="#0ECB81" stroke-width="2" rx="3" stroke-dasharray="4,2"/>
      
      <!-- Progress Percentage Labels -->
      <text x="175" y="24" text-anchor="end" fill="#0ECB81" font-family="monospace" font-size="11">25%</text>
      <text x="175" y="68" text-anchor="end" fill="#0ECB81" font-family="monospace" font-size="11">50%</text>
      <text x="175" y="112" text-anchor="end" fill="#0ECB81" font-family="monospace" font-size="11">75%</text>
      <text x="175" y="156" text-anchor="end" fill="#0ECB81" font-family="monospace" font-size="11" font-weight="bold">100%</text>
      
      <!-- "The Wall" indicator -->
      <text x="85" y="195" text-anchor="middle" fill="#0ECB81" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">⬆️ "墙" 顶天立地！</text>
    </g>

    <!-- Ask Side (Right) - Max 25% width (200/800) - visually weak -->
    <g transform="translate(210, 85)">
      <!-- Signal bars: 50/800=6.25%, 100/800=12.5%, 150/800=18.75%, 200/800=25% -->
      <rect x="0" y="0" width="11" height="38" fill="url(#askGradient)" rx="3"/>
      <rect x="0" y="44" width="21" height="38" fill="url(#askGradient)" rx="3"/>
      <rect x="0" y="88" width="32" height="38" fill="url(#askGradient)" rx="3"/>
      <rect x="0" y="132" width="42" height="38" fill="url(#askGradient)" rx="3"/>

      <!-- Progress Percentage Labels -->
      <text x="5" y="24" text-anchor="start" fill="#F6465D" font-family="monospace" font-size="11">6%</text>
      <text x="5" y="68" text-anchor="start" fill="#F6465D" font-family="monospace" font-size="11">12%</text>
      <text x="5" y="112" text-anchor="start" fill="#F6465D" font-family="monospace" font-size="11">19%</text>
      <text x="5" y="156" text-anchor="start" fill="#F6465D" font-family="monospace" font-size="11">25%</text>
      
      <!-- "Weak" indicator -->
      <text x="85" y="195" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="10">← 抛压微弱</text>
    </g>

    <!-- Success Callout -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="400" height="65" fill="#1A3D2A" rx="8" stroke="#0ECB81" stroke-width="1" stroke-opacity="0.5"/>
      <text x="200" y="22" text-anchor="middle" fill="#0ECB81" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">✓ 视觉真相</text>
      <text x="200" y="42" text-anchor="middle" fill="#EAECEF" font-family="system-ui, sans-serif" font-size="11">买盘是"巨墙"，撑满屏幕；卖盘干瘪如风中芦苇。</text>
      <text x="200" y="57" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="10">交易员一眼识别：支撑极强，上涨阻力小 (Bullish)。</text>
    </g>
  </g>

  <!-- ==================== FORMULA COMPARISON ==================== -->
  <g transform="translate(30, 490)">
    <!-- Title -->
    <text x="420" y="0" text-anchor="middle" fill="#EAECEF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">公式对比</text>
    
    <!-- Sum Formula -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="400" height="75" fill="#2B2F36" rx="8"/>
      <text x="200" y="22" text-anchor="middle" fill="#F6465D" font-family="monospace" font-size="14">progress = cumulative / (bid + ask)</text>
      <text x="200" y="45" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="11">买盘最大：800 / 1000 = <tspan fill="#F6465D" font-weight="bold">80%</tspan></text>
      <text x="200" y="63" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="11">卖盘最大：200 / 1000 = <tspan fill="#F6465D" font-weight="bold">20%</tspan></text>
    </g>

    <!-- Max Formula -->
    <g transform="translate(440, 20)">
      <rect x="0" y="0" width="400" height="75" fill="#1E3A2F" rx="8"/>
      <text x="200" y="22" text-anchor="middle" fill="#0ECB81" font-family="monospace" font-size="14">progress = cumulative / max(bid, ask)</text>
      <text x="200" y="45" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="11">买盘最大：800 / 800 = <tspan fill="#0ECB81" font-weight="bold">100%</tspan> 🏆</text>
      <text x="200" y="63" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="11">卖盘最大：200 / 800 = <tspan fill="#0ECB81" font-weight="bold">25%</tspan></text>
    </g>
  </g>

  <!-- ==================== KEY INSIGHT ==================== -->
  <g transform="translate(30, 610)">
    <rect x="0" y="0" width="840" height="50" fill="#252833" rx="8"/>
    <text x="420" y="20" text-anchor="middle" fill="#EAECEF" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🎯 核心洞察</text>
    <text x="420" y="40" text-anchor="middle" fill="#848E9C" font-family="system-ui, sans-serif" font-size="12">交易员看盘口是在找"墙"(Wall)。Max 逻辑让最强的那堵墙顶天立地，Sum 逻辑会把"墙"矮化，误导交易决策。</text>
  </g>

  <!-- Footer -->
  <text x="450" y="675" text-anchor="middle" fill="#484D56" font-family="system-ui, sans-serif" font-size="10">© Veltrix - Order Book Normalization: Max vs Sum</text>
</svg>
